<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Seguridad (GitHub Pages no deja fijar cabeceras HTTP, así que van en <meta>):
       · CSP: todo (scripts, estilos, fuentes, workers, datos) sale del propio
         origen; sin terceros. script-src solo admite el script de tema de
         abajo por su hash — SI SE EDITA ESE SCRIPT HAY QUE RECALCULAR EL HASH
         (tests/security-headers.mjs lo comprueba). style-src necesita
         'unsafe-inline' (el editor de figuras inyecta un <style> y hay atributos
         style en el HTML generado). img/font blob:/data: = exportación de
         figuras y fuentes incrustadas en el informe. form-action permite el
         envío por lotes a NCBI BLAST (módulo Sanger); los enlaces normales
         (BLAST, KEGG, GitHub) son navegación y no los limita la CSP.
       · referrer no-referrer: ningún enlace de salida envía la URL de la app. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-B5/r+j5fxQjCag9huICf69sdgebuHQPhbvdrjlrIkts='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://blast.ncbi.nlm.nih.gov" />
  <meta name="referrer" content="no-referrer" />
  <title>Smart-175 — plataforma bioinformática integral</title>
  <meta name="description" content="Plataforma bioinformática que se ejecuta en tu navegador (los archivos no se envían a ningún servidor). Analiza metabarcoding, procesa cromatogramas Sanger, ejecuta alineamientos Smith-Waterman y visualiza filogenias y dinámicas temporales. Privacidad absoluta: todos los cálculos se realizan localmente en tu navegador." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12615f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#57c9be" media="(prefers-color-scheme: dark)" />
  <script>
    // Aplica el tema guardado ANTES del primer pintado, para no dar un
    // parpadeo claro→oscuro mientras carga js/app.js (módulo ES, diferido
    // por especificación). js/lib/theme.js hace lo mismo en cada cambio;
    // esto solo cubre el instante de arranque. Sin nada guardado: oscuro
    // (theme.js DEFAULT_THEME); 'auto' = sin atributo, sigue al sistema.
    var qlTheme = 'dark';
    try {
      qlTheme = localStorage.getItem('smart-175.theme') || localStorage.getItem('qiimelab.theme') || 'dark';
    } catch (e) {}
    if (qlTheme !== 'light' && qlTheme !== 'auto') qlTheme = 'dark';
    if (qlTheme !== 'auto') document.documentElement.setAttribute('data-theme', qlTheme);
  </script>
  <link rel="preload" href="fonts/IBMPlexSans-var.latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div class="ql-shell">
    <nav class="ql-sidebar" id="sidebar"></nav>
    <div class="ql-main-col">
      <main class="ql-main" id="app-view"></main>
      <footer class="ql-footer" id="app-footer"></footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
