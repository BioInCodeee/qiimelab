<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart-175 — plataforma bioinformática integral</title>
  <meta name="description" content="Plataforma bioinformática que se ejecuta en tu navegador (los archivos no se envían a ningún servidor). Analiza metabarcoding, procesa cromatogramas Sanger, ejecuta alineamientos Smith-Waterman y visualiza filogenias y dinámicas temporales. Privacidad absoluta: todos los cálculos se realizan localmente en tu navegador." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12615f" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#57c9be" media="(prefers-color-scheme: dark)" />
  <script>
    // Aplica el tema guardado ANTES del primer pintado, para no dar un
    // parpadeo claro→oscuro mientras carga js/app.js (módulo ES, diferido
    // por especificación). js/lib/theme.js hace lo mismo en cada cambio;
    // esto solo cubre el instante de arranque.
    try {
      var qlTheme = localStorage.getItem('smart-175.theme') || localStorage.getItem('qiimelab.theme');
      if (qlTheme === 'light' || qlTheme === 'dark') document.documentElement.setAttribute('data-theme', qlTheme);
    } catch (e) {}
  </script>
  <link rel="preload" href="fonts/IBMPlexSans-var.latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="ql-shell">
    <nav class="ql-sidebar" id="sidebar"></nav>
    <div class="ql-main-col">
      <main class="ql-main" id="app-view"></main>
      <footer class="ql-footer" id="app-footer"></footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
